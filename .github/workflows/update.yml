name: NBA_Auto_Update
on:
  schedule:
    - cron: '0 22 * * *' # 北京时间每天早上6点自动运行
  workflow_dispatch: # 按钮，允许你随时手动点击运行

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖包
        run: pip install requests

      - name: 执行抓取脚本
        run: python main.py

      - name: 提交并推送生成的M3U文件
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add my_nba_list.m3u
          git commit -m "自动更新直播源: $(date)" || exit 0
          git push
